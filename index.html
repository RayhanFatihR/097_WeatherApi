<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API - MapTiler</title>
    <style> 
        body { font-family: Arial, sans-serif; background: #e8f1fb; display: flex; justify-content: center; padding: 40px; }
        .card { background: #fff; padding: 24px; border-radius: 12px; width: 380px; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; font-size: 15px; }
        button { background: #2f80ed; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
        table { width: 100%; margin-top: 16px; border-collapse: collapse; }
        td { padding: 8px; border-bottom: 1px solid #ddd; }
        td:first-child { font-weight: bold; width: 40%; }
    </style>
</head>
<body>
    <div class="card">
    <h2>🌤️ Data Lokasi</h2>
    <input type="text" id="lokasi" placeholder="Yogyakarta, Indonesia">
    <button onclick="cariLokasi()">Cari</button>

    <table id="hasil" style="display:none">
      <tr><td>Lokasi</td><td id="nama"></td></tr>
      <tr><td>Negara</td><td id="negara"></td></tr>
      <tr><td>Provinsi</td><td id="provinsi"></td></tr>
      <tr><td>Kecamatan</td><td id="kecamatan"></td></tr>
      <tr><td>Longitude</td><td id="lon"></td></tr>
      <tr><td>Latitude</td><td id="lat"></td></tr>
    </table>
    <p id="pesan"></p>

    <script>
    const API_KEY = "0uHfzelXJpJMUL6vAJl9";

    async function cariLokasi() {
      const q = document.getElementById("lokasi").value.trim();
      const pesan = document.getElementById("pesan");
      const tabel = document.getElementById("hasil");
      if (!q) { pesan.textContent = "Isi lokasi dulu."; return; }

      pesan.textContent = "Memuat...";
      tabel.style.display = "none";

      try {
        const url = `https://api.maptiler.com/geocoding/${encodeURIComponent(q)}.json?key=${API_KEY}&language=id`;
        const res = await fetch(url);
        const data = await res.json();
        console.log(data);

        if (!data.features || data.features.length === 0) {
          pesan.textContent = "Lokasi tidak ditemukan.";
          return;
        }

        const f = data.features[0];
        const ctx = f.context || [];
        // cari komponen alamat berdasarkan tipe
        const ambil = (...tipe) => {
          const c = ctx.find(x => tipe.some(t => x.id.startsWith(t)));
          return c ? c.text : "-";
        };
        // jika hasil utama itu sendiri sebuah negara/provinsi/kecamatan
        const jenis = f.place_type ? f.place_type[0] : "";

        document.getElementById("nama").textContent = f.place_name;
        document.getElementById("negara").textContent = jenis === "country" ? f.text : ambil("country");
        document.getElementById("provinsi").textContent = jenis === "region" ? f.text : ambil("region");
        document.getElementById("kecamatan").textContent =
          ["municipality", "county", "subregion"].includes(jenis) ? f.text : ambil("municipality", "county", "subregion", "locality");
        document.getElementById("lon").textContent = f.center[0];
        document.getElementById("lat").textContent = f.center[1];

        tabel.style.display = "table";
        pesan.textContent = "";
      } catch (e) {
        pesan.textContent = "Error: " + e.message;
      }
    }
  </script>
</body>
</html>
